version: 2

sources:
  - name: portvessel_gold
    description: "Validated PortVessel gold tables loaded by the Cloud Run ingestion job."
    database: cloudprojects-506123
    schema: portvessel_dev_gold
    tables:
      - name: fct_anchorage_dwell
        description: "Observed anchorage dwell episodes derived from AIS pings."
        loaded_at_field: loaded_at_utc
        config:
          freshness:
            warn_after:
              count: 48
              period: hour
            error_after:
              count: 168
              period: hour
        columns:
          - name: anchorage_dwell_id
            tests:
              - not_null
              - unique
          - name: mmsi
            tests:
              - not_null
          - name: entry_observed_at_utc
            tests:
              - not_null
          - name: exit_observed_at_utc
            tests:
              - not_null

      - name: fct_port_call
        description: "Observed vessel port calls derived from AIS observations."
        columns:
          - name: port_call_id
            tests:
              - not_null
              - unique
          - name: mmsi
            tests:
              - not_null
          - name: arrival_observed_at_utc
            tests:
              - not_null

      - name: agg_port_congestion_daily
        description: "Daily observed congestion metrics by port."
        loaded_at_field: loaded_at_utc
        config:
          freshness:
            warn_after:
              count: 48
              period: hour
            error_after:
              count: 168
              period: hour
        columns:
          - name: metric_date
            tests:
              - not_null
          - name: port_id
            tests:
              - not_null

      - name: vessel_operational_risk_flags
        description: "Vessel-level operational risk indicators derived from observed port activity."
        columns:
          - name: mmsi
            tests:
              - not_null
              - unique
          - name: operational_flag
            tests:
              - not_null
