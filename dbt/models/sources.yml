version: 2

sources:
  - name: portvessel_staging
    description: "Raw normalized AIS pings loaded by the PortVessel Cloud Run loader."
    database: cloudprojects-506123
    schema: portvessel_dev_staging
    tables:
      - name: ais_pings
        description: "Normalized AIS pings prior to dbt cleansing and geospatial enrichment."
        config:
          loaded_at_field: ingested_at_utc
          freshness:
            warn_after:
              count: 48
              period: hour
            error_after:
              count: 168
              period: hour
        columns:
          - name: record_hash
            tests:
              - not_null

          - name: observed_at_utc
            tests:
              - not_null

          - name: ingestion_run_id
            tests:
              - not_null

  - name: portvessel_gold
    description: "Validated PortVessel gold tables used by downstream marts."
    database: cloudprojects-506123
    schema: portvessel_dev_gold
    tables:
      - name: fct_anchorage_dwell
        description: "Observed anchorage dwell episodes derived from AIS pings."
        config:
          loaded_at_field: loaded_at_utc
          freshness:
            warn_after:
              count: 48
              period: hour
            error_after:
              count: 168
              period: hour
        columns:
          - name: anchorage_dwell_id
            tests:
              - not_null
              - unique

          - name: mmsi
            tests:
              - not_null

          - name: anchorage_entered_at_utc
            tests:
              - not_null

          - name: anchorage_exited_at_utc
            tests:
              - not_null

      - name: fct_port_calls
        description: "Observed vessel port calls derived from configured geofences and AIS observations."
        config:
          loaded_at_field: loaded_at_utc
          freshness:
            warn_after:
              count: 48
              period: hour
            error_after:
              count: 168
              period: hour
        columns:
          - name: port_call_id
            tests:
              - not_null
              - unique

          - name: mmsi
            tests:
              - not_null

          - name: arrival_observed_at_utc
            tests:
              - not_null

      - name: agg_port_congestion_daily
        description: "Daily observed congestion metrics by port."
        config:
          loaded_at_field: loaded_at_utc
          freshness:
            warn_after:
              count: 48
              period: hour
            error_after:
              count: 168
              period: hour
        columns:
          - name: metric_date
            tests:
              - not_null

          - name: port_id
            tests:
              - not_null

      - name: vessel_operational_risk_flags
        description: "Vessel-level operational risk indicators derived from observed port activity."
        columns:
          - name: mmsi
            tests:
              - not_null
              - unique

          - name: operational_flag
            tests:
              - not_null