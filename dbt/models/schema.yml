version: 2

models:
  - name: mart_port_congestion
    description: "Daily port congestion mart."
    columns:
      - name: metric_date
        tests:
          - not_null

      - name: port_id
        tests:
          - not_null

      - name: anchorage_call_rate
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "between 0 and 1"

  - name: mart_vessel_risk
    description: "Latest operational risk snapshot per vessel."
    columns:
      - name: mmsi
        tests:
          - not_null
          - unique

      - name: operational_flag
        tests:
          - not_null

      - name: anchorage_call_rate
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "between 0 and 1"

  - name: stg_ais_pings
    description: "Cleaned, deduplicated AIS pings with explicit validation flags and geography points."
    columns:
      - name: record_hash
        description: "Stable raw-record deduplication key."
        tests:
          - not_null
          - unique

      - name: observed_at_utc
        tests:
          - not_null

      - name: observed_date
        tests:
          - not_null

      - name: mmsi
        tests:
          - not_null:
              config:
                where: "is_analytics_eligible"

      - name: ping_geography
        tests:
          - not_null:
              config:
                where: "is_analytics_eligible"

      - name: is_analytics_eligible
        tests:
          - not_null

  - name: dim_geofences
    description: "Versioned active operational geofence dimension."
    columns:
      - name: geofence_id
        tests:
          - not_null
          - unique

      - name: port_id
        tests:
          - not_null

      - name: zone_type
        tests:
          - accepted_values:
              arguments:
                values: ["port_area", "anchorage", "berth"]

      - name: zone_geography
        tests:
          - not_null:
              config:
                where: "zone_type in ('port_area', 'anchorage')"

      - name: berth_line_geography
        tests:
          - not_null:
              config:
                where: "zone_type = 'berth'"

  - name: int_ais_pings_geofenced
    description: "Analytics-eligible AIS pings with one prioritized geofence assignment."
    columns:
      - name: record_hash
        tests:
          - not_null
          - unique

      - name: observed_date
        tests:
          - not_null

      - name: zone_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["port_area", "anchorage", "berth", "outside"]

  - name: int_vessel_state_intervals
    description: >
      Contiguous observed vessel-state intervals derived from geofenced AIS pings.
      Intervals split on state change, port change, or AIS gaps longer than three hours.
      Censoring flags identify intervals that touch the available AIS source-window boundary.
    columns:
      - name: vessel_state_interval_id
        tests:
          - not_null
          - unique

      - name: mmsi
        tests:
          - not_null

      - name: vessel_state
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["outside", "port_area", "anchorage", "berth"]

      - name: state_started_at_utc
        tests:
          - not_null

      - name: state_ended_at_utc
        tests:
          - not_null

      - name: duration_observability_status
        description: >
          Whether an interval duration is fully observed or censored by the start
          or end of the AIS source window.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["observed", "partial", "left_censored", "right_censored", "both_censored"]

  - name: fct_port_calls
    description: >
      Observed vessel visits to USLAX, formed from geofenced in-port state intervals
      and split after more than six hours between observed intervals. These are
      operational estimates, not legal berth-call or demurrage records. Port-duration
      values are populated only for calls that are fully observed and non-partial.
    columns:
      - name: port_call_id
        tests:
          - not_null
          - unique

      - name: mmsi
        tests:
          - not_null

      - name: port_id
        tests:
          - not_null

      - name: arrival_observed_at_utc
        tests:
          - not_null

      - name: departure_observed_at_utc
        tests:
          - not_null

      - name: port_call_quality_status
        description: "Call-level observation status based on state-interval censoring and completeness."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["observed", "partial", "left_censored", "right_censored", "both_censored", "invalid"]

  - name: fct_anchorage_dwell
    description: >
      USLAX anchorage intervals derived from geofenced AIS pings. Anchorage dwell
      duration is populated only when the full interval is observed.
    columns:
      - name: anchorage_dwell_id
        tests:
          - not_null
          - unique

      - name: mmsi
        tests:
          - not_null

      - name: port_id
        tests:
          - not_null

      - name: anchorage_entered_at_utc
        tests:
          - not_null

      - name: anchorage_exited_at_utc
        tests:
          - not_null

      - name: anchorage_dwell_quality_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["observed", "partial"]

  - name: agg_port_congestion_daily
    description: >
      Daily USLAX operational congestion metrics. Detected call counts include all
      identified in-port sequences. Port-duration KPIs include only fully observed
      calls; anchorage and berth-proximity KPIs include only their respective fully
      observed dwell intervals.
    columns:
      - name: metric_date
        tests:
          - not_null

      - name: port_id
        tests:
          - not_null

      - name: detected_port_calls
        description: "All detected in-port call sequences, including partial and censored calls."
        tests:
          - not_null

      - name: detected_vessels
        description: "Distinct vessels with at least one detected port-call sequence."
        tests:
          - not_null

      - name: complete_port_calls
        description: "Calls eligible for full arrival-to-departure duration metrics."
        tests:
          - not_null

      - name: observed_port_calls
        description: "Calls whose overall observation status is observed."
        tests:
          - not_null

      - name: port_calls_with_observed_anchorage_wait
        description: "Calls with a fully observed anchorage dwell duration."
        tests:
          - not_null

      - name: port_calls_with_observed_berth_proximity_dwell
        description: "Calls with a fully observed berth-proximity dwell duration."
        tests:
          - not_null
