main:
  params: [args]
  steps:
    - init:
        assign:
          - project: ${default(map.get(args, "project"), "cloudprojects-506123")}
          - region: ${default(map.get(args, "region"), "europe-west3")}
          - ingestion_job: ${default(map.get(args, "ingestion_job"), "portvessel-ingestion-dev")}
          - loader_job: ${default(map.get(args, "loader_job"), "portvessel-bq-loader-dev")}
          - transform_job: ${default(map.get(args, "transform_job"), "portvessel-dbt-transform-dev")}
          - quality_job: ${default(map.get(args, "quality_job"), "portvessel-quality-dev")}
          - cursor_dataset: ${default(map.get(args, "cursor_dataset"), "portvessel_dev_staging")}
          - cursor_table: ${default(map.get(args, "cursor_table"), "pipeline_cursor")}
          - pipeline_name: ${default(map.get(args, "pipeline_name"), "portvessel_noaa_daily_ingestion")}
          - processed_bucket: ${"cloudprojects-506123-portvessel-dev-processed"}
          - run_id: ${string(sys.now())}

    - get_cursor:
        call: googleapis.bigquery.v2.jobs.query
        args:
          projectId: ${project}
          body:
            location: ${region}
            useLegacySql: false
            parameterMode: NAMED
            query: ${"SELECT CAST(next_source_date AS STRING) AS source_date FROM `" + project + "." + cursor_dataset + "." + cursor_table + "` WHERE pipeline_name=@pipeline_name AND status='ready' LIMIT 1"}
            queryParameters:
              - name: pipeline_name
                parameterType:
                  type: STRING
                parameterValue:
                  value: ${pipeline_name}
        result: cursor_result

    - validate_cursor:
        switch:
          - condition: ${len(cursor_result.rows) == 0}
            next: fail_no_cursor
        next: set_source_date

    - set_source_date:
        assign:
          - source_date: ${cursor_result.rows[0].f[0].v}
        next: run_ingestion

    - fail_no_cursor:
        raise: "No ready pipeline cursor found"

    - run_ingestion:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project + "/locations/" + region + "/jobs/" + ingestion_job}
          body:
            overrides:
              containerOverrides:
                - env:
                    - name: SOURCE_DATE
                      value: ${source_date}
                    - name: RUN_ID
                      value: ${run_id}
        result: ingestion_result
        next: run_loader

    - run_loader:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project + "/locations/" + region + "/jobs/" + loader_job}
          body:
            overrides:
              containerOverrides:
                - env:
                    - name: SOURCE_DATE
                      value: ${source_date}
                    - name: RUN_ID
                      value: ${run_id}
                    - name: GCS_PROCESSED_BUCKET
                      value: ${processed_bucket}
                    - name: GCP_PROJECT_ID
                      value: ${project}
                    - name: BQ_LOCATION
                      value: ${region}
                    - name: BQ_DATASET
                      value: ${cursor_dataset}
                    - name: BQ_TABLE
                      value: "ais_pings"
                    - name: AUDIT_DATASET
                      value: ${cursor_dataset}
                    - name: AUDIT_TABLE
                      value: "ingestion_run_audit"
                    - name: PIPELINE_NAME
                      value: ${pipeline_name}
        result: loader_result
        next: run_transform

    - run_transform:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project + "/locations/" + region + "/jobs/" + transform_job}
          body:
            overrides:
              containerOverrides:
                - env:
                    - name: SOURCE_DATE
                      value: ${source_date}
                    - name: RUN_ID
                      value: ${run_id}
                    - name: GCP_PROJECT_ID
                      value: ${project}
                    - name: BQ_LOCATION
                      value: ${region}
        result: transform_result
        next: run_quality

    - run_quality:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project + "/locations/" + region + "/jobs/" + quality_job}
          body:
            overrides:
              containerOverrides:
                - env:
                    - name: SOURCE_DATE
                      value: ${source_date}
                    - name: RUN_ID
                      value: ${run_id}
                    - name: GCP_PROJECT_ID
                      value: ${project}
                    - name: BQ_LOCATION
                      value: ${region}
                    - name: QUALITY_DATASET
                      value: ${cursor_dataset}
        result: quality_result
        next: advance_cursor

    - advance_cursor:
        call: googleapis.bigquery.v2.jobs.query
        args:
          projectId: ${project}
          body:
            location: ${region}
            useLegacySql: false
            parameterMode: NAMED
            query: ${"UPDATE `" + project + "." + cursor_dataset + "." + cursor_table + "` SET next_source_date=DATE_ADD(DATE('" + source_date + "'), INTERVAL 1 DAY), last_run_id=@run_id, updated_at=CURRENT_TIMESTAMP() WHERE pipeline_name=@pipeline_name AND next_source_date=DATE('" + source_date + "') AND status='ready'"}
            queryParameters:
              - name: run_id
                parameterType:
                  type: STRING
                parameterValue:
                  value: ${run_id}
              - name: pipeline_name
                parameterType:
                  type: STRING
                parameterValue:
                  value: ${pipeline_name}
        result: cursor_update

    - done:
        return:
          status: completed
          source_date: ${source_date}
          ingestion: ${ingestion_result}
          loader: ${loader_result}
          transform: ${transform_result}
          quality: ${quality_result}
          cursor_update: ${cursor_update}
